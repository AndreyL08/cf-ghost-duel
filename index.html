<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CF Ghost Duel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C9.4 3 5 7.8 5 14v14.5l3.7-2.7 3.6 2.7 3.7-2.7 3.7 2.7 3.6-2.7 3.7 2.7V14C27 7.8 22.6 3 16 3z' fill='%238b45c9'/%3E%3Ccircle cx='12' cy='14' r='2.2' fill='%23fff'/%3E%3Ccircle cx='20' cy='14' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f4f7;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --raise:#ffffff;
  --ink:#10131a;
  --muted:#656c79;
  --line:#e4e7ec;
  --line-strong:#cdd2da;
  --you:#2f5bea;
  --you-soft:#e9efff;
  --on-you:#ffffff;
  --ghost:#8b45c9;
  --ghost-soft:#f4ecfb;
  --ok:#17803d;
  --bad:#c42b2b;
  --wait:#a86500;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -18px rgba(16,24,40,.18);
  --r-gray:#7c7c7c;--r-green:#008000;--r-cyan:#03a89e;--r-blue:#2a3fd6;--r-violet:#a0a;--r-orange:#e08a00;--r-red:#e00000;
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12;--surface:#12151c;--surface-2:#181c25;--raise:#272d3a;--ink:#e9ecf2;--muted:#8a93a3;--line:#232835;--line-strong:#343b4c;
  --you:#7aa2ff;--you-soft:rgba(122,162,255,.14);--on-you:#0b0d12;--ghost:#c792f0;--ghost-soft:rgba(199,146,240,.12);--ok:#4fcf7c;--bad:#ff6b6b;--wait:#f0b04a;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 16px 40px -24px rgba(0,0,0,.6);
  --r-gray:#a0a0a0;--r-green:#4fc44f;--r-cyan:#3fd6cb;--r-blue:#7b8cff;--r-violet:#e070e0;--r-orange:#ffad33;--r-red:#ff5555;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0d12;--surface:#12151c;--surface-2:#181c25;--raise:#272d3a;--ink:#e9ecf2;--muted:#8a93a3;--line:#232835;--line-strong:#343b4c;
  --you:#7aa2ff;--you-soft:rgba(122,162,255,.14);--on-you:#0b0d12;--ghost:#c792f0;--ghost-soft:rgba(199,146,240,.12);--ok:#4fcf7c;--bad:#ff6b6b;--wait:#f0b04a;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 16px 40px -24px rgba(0,0,0,.6);
  --r-gray:#a0a0a0;--r-green:#4fc44f;--r-cyan:#3fd6cb;--r-blue:#7b8cff;--r-violet:#e070e0;--r-orange:#ffad33;--r-red:#ff5555;
  color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
a{color:var(--you);text-underline-offset:3px;text-decoration-thickness:1px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 4px 4px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;flex:none}
.logo .body{fill:var(--ghost)}.logo .eye{fill:var(--surface)}
.brand h1{font:800 21px/1.1 var(--f-display);margin:0;letter-spacing:-.03em;white-space:nowrap}
.brand h1 b{color:var(--ghost);font-weight:800}
.brand span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.hright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.record{display:flex;gap:6px;align-items:center}
.record i{font:700 13px/1 var(--f-display);font-style:normal;font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.record .w{color:var(--ok)}.record .l{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow)}
.panel h2{font:800 18px/1.2 var(--f-display);margin:0;letter-spacing:-.02em}
#arena{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label,.lbl{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.field input{height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 14px;width:100%;min-width:0;font-weight:600;transition:border-color .15s,box-shadow .15s,background .15s}
.field input::placeholder{color:var(--muted);font-weight:500;opacity:.7}
.field input:hover{border-color:var(--line-strong)}
.field input:focus{outline:none;border-color:var(--you);box-shadow:0 0 0 4px var(--you-soft);background:var(--surface)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.range{display:flex;gap:8px;align-items:center}
.range input{text-align:center}
.range span{color:var(--muted)}
.stepper{display:flex;align-items:stretch;height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.stepper:hover{border-color:var(--line-strong)}
.stepper:focus-within{border-color:var(--you);box-shadow:0 0 0 4px var(--you-soft)}
.field .stepper input{height:100%;border:0;border-radius:0;background:transparent;box-shadow:none;text-align:center;font-weight:800;font-size:16px;padding:0 4px}
.stepper button{flex:none;width:44px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;transition:background .15s,color .15s}
.stepper button:hover{background:var(--line);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:0;max-width:72ch}

.switch{display:flex;gap:12px;align-items:center;cursor:pointer;width:fit-content}
.switch input{appearance:none;-webkit-appearance:none;margin:0;flex:none;width:40px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .2s}
.switch input::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch input:checked{background:var(--you)}
.switch input:checked::before{transform:translateX(16px)}
.switch b{font-weight:600;font-size:14px;display:block}
.switch small{display:block;color:var(--muted);font-size:13px}

.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px var(--line)}
.seg.wide{display:flex;max-width:560px;height:46px}
.seg.wide button{flex:1;padding:0 6px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--you);border-color:var(--you);color:var(--on-you)}
.tagrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s,filter .15s}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{height:50px;padding:0 26px;background:var(--you);border-color:transparent;color:var(--on-you);font-size:15px;font-weight:800;letter-spacing:-.01em}
.btn.primary:hover{background:var(--you);filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.log{font:500 13px/1.6 var(--f-mono);color:var(--muted);margin:0;min-height:1.6em}
.log.err{color:var(--bad)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.problem{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.problem .pid{font:700 12px/1 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.problem h3{font:800 24px/1.25 var(--f-display);letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.clock{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:6px 0 2px}
.clock .t{font:800 clamp(56px,13vw,88px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.clock .sub{font:600 13px/1 var(--f-body);color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;width:100%;max-width:440px}
.bar i{display:block;height:100%;background:var(--you);border-radius:999px;width:0;transition:width .5s linear}

.lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lane{border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid var(--line);background:var(--surface-2);position:relative;overflow:hidden}
.lane::before{content:"";position:absolute;inset:0 auto 0 0;width:3px}
.lane.you::before{background:var(--you)}.lane.gh::before{background:var(--ghost)}
.lane .who{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lane .who b{font:800 15px/1.2 var(--f-display);display:flex;align-items:center;gap:8px}
.lane .who b::before{content:"";width:8px;height:8px;border-radius:50%}
.lane.you .who b::before{background:var(--you)}.lane.gh .who b::before{background:var(--ghost)}
.handle{font:700 14px/1.2 var(--f-body);overflow-wrap:anywhere}
.state{font-size:13px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font:500 13px/1.4 var(--f-mono)}
.feed li{display:flex;gap:12px;align-items:baseline;padding:6px 10px;border-radius:8px;background:var(--surface)}
.feed .ts{color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px}
.v-ok{color:var(--ok);font-weight:700}.v-bad{color:var(--bad)}.v-wait{color:var(--wait)}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:18px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.vs .side small{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em}
.vs .side .handle{font-size:18px;font-weight:800}
.vs .x{font:800 15px/1 var(--f-display);color:var(--muted);letter-spacing:.06em}
.rt{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}

.result{border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface-2);position:relative;overflow:hidden;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.result::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--muted)}
.result.won::before{background:var(--ok)}.result.lost::before{background:var(--bad)}
.result h3{font:800 30px/1.1 var(--f-display);letter-spacing:-.03em;margin:0}
.result.won h3{color:var(--ok)}.result.lost h3{color:var(--bad)}.result.draw h3{color:var(--muted)}
.result p{margin:0;max-width:68ch;color:var(--ink)}

.tbl{overflow-x:auto;margin:0 -8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.p{white-space:normal;min-width:180px}
td.p a{font-weight:700;text-decoration:none}
td.p a:hover{text-decoration:underline}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.won{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.badge.lost{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.empty{color:var(--muted);font-size:14px;margin:0}
.r-gray{color:var(--r-gray)}.r-green{color:var(--r-green)}.r-cyan{color:var(--r-cyan)}.r-blue{color:var(--r-blue)}.r-violet{color:var(--r-violet)}.r-orange{color:var(--r-orange)}.r-red{color:var(--r-red)}

@media (max-width:640px){
  body{padding-block:18px 40px}
  .panel{padding:18px;border-radius:16px;gap:18px}
  .lanes{grid-template-columns:1fr}
  .problem .btn{width:100%}
  .actions .btn{flex:1}
  .seg.wide button{font-size:13px}
  .c-date{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.dots::after{content:"..."}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path class="body" d="M16 3C9.4 3 5 7.8 5 14v14.5l3.7-2.7 3.6 2.7 3.7-2.7 3.7 2.7 3.6-2.7 3.7 2.7V14C27 7.8 22.6 3 16 3z"/><circle class="eye" cx="12" cy="14" r="2.2"/><circle class="eye" cx="20" cy="14" r="2.2"/></svg>
      <div><h1>CF <b>Ghost</b> Duel</h1><span data-i18n="tagline"></span></div>
    </div>
    <div class="hright">
      <div class="record" id="record"></div>
      <div class="seg" id="lang" role="group" data-i18n-aria="langAria"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
    </div>
  </header>

  <section class="panel" id="setup">
    <h2 data-i18n="newDuel"></h2>
    <div class="grid">
      <div class="field"><label for="handle" data-i18n="handle"></label><input id="handle" placeholder="tourist" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="rmin" data-i18n="probRating"></label>
        <div class="range"><input id="rmin" type="number" inputmode="numeric" min="800" max="3500" step="100" data-i18n-aria="ratingFrom"><span>—</span><input id="rmax" type="number" inputmode="numeric" min="800" max="3500" step="100" data-i18n-aria="ratingTo"></div></div>
      <div class="field"><label for="bot" data-i18n="oppLevel"></label>
        <div class="stepper"><button type="button" data-step="-50" data-i18n-aria="dec50">−</button><input id="bot" type="number" inputmode="numeric" min="400" max="3800" step="50"><button type="button" data-step="50" data-i18n-aria="inc50">+</button></div></div>
    </div>
    <div class="field"><span class="lbl" id="limit-lbl" data-i18n="limitLbl"></span>
      <div class="seg wide" id="limit" role="group" aria-labelledby="limit-lbl"><button type="button" data-limit="5">5</button><button type="button" data-limit="10">10</button><button type="button" data-limit="15">15</button><button type="button" data-limit="30">30</button><button type="button" data-limit="45">45</button><button type="button" data-limit="60">60</button><button type="button" data-limit="90">90</button><button type="button" data-limit="120">120</button></div></div>
    <label class="switch"><input type="checkbox" id="adaptive" role="switch"><span><b data-i18n="adaptive"></b><small data-i18n="adaptiveSub"></small></span></label>
    <div class="field">
      <div class="tagrow"><span class="lbl" data-i18n="tags"></span>
        <div class="seg" role="group" data-i18n-aria="tagModeAria"><button type="button" id="mode-all" data-i18n="modeAll"></button><button type="button" id="mode-any" data-i18n="modeAny"></button></div></div>
      <div class="tags" id="tags"></div>
    </div>
    <div class="actions"><button class="btn primary" id="go" data-i18n="find"></button><p class="log" id="log"></p></div>
    <p class="hint" data-i18n="setupHint"></p>
  </section>

  <section class="panel" id="arena" hidden></section>

  <section class="panel" id="hist">
    <h2 data-i18n="history"></h2>
    <div id="histBody"></div>
  </section>
</div>

<script>
const TAGS=["implementation","math","greedy","dp","data structures","brute force","constructive algorithms","graphs","sortings","binary search","dfs and similar","trees","strings","number theory","combinatorics","two pointers","bitmasks","geometry","dsu","shortest paths","probabilities","divide and conquer","hashing","games","interactive","matrices"];
// Русские названия тегов как в русском интерфейсе Codeforces
const TAG_RU={"implementation":"реализация","math":"математика","greedy":"жадные алгоритмы","dp":"дп","data structures":"структуры данных","brute force":"перебор","constructive algorithms":"конструктив","graphs":"графы","sortings":"сортировки","binary search":"бинарный поиск","dfs and similar":"поиск в глубину и подобное","trees":"деревья","strings":"строки","number theory":"теория чисел","combinatorics":"комбинаторика","two pointers":"два указателя","bitmasks":"битмаски","geometry":"геометрия","dsu":"снм","shortest paths":"кратчайшие пути","probabilities":"теория вероятностей","divide and conquer":"разделяй и властвуй","hashing":"хэши","games":"игры","interactive":"интерактив","matrices":"матрицы","*special":"*особая задача","chinese remainder theorem":"китайская теорема об остатках","expression parsing":"разбор выражений","fft":"быстрое преобразование Фурье","flows":"потоки","graph matchings":"паросочетания","schedules":"расписания","string suffix structures":"строковые суфф. структуры","ternary search":"тернарный поиск"};
const I18N={
  ru:{
    tagline:"дуэль с призраком реального участника",langAria:"Язык",
    newDuel:"Новая дуэль",handle:"Твой хэндл",probRating:"Рейтинг задачи",ratingFrom:"Рейтинг задачи от",ratingTo:"Рейтинг задачи до",
    oppLevel:"Уровень соперника",dec50:"Уменьшить на 50",inc50:"Увеличить на 50",limitLbl:"Лимит времени, минуты",
    adaptive:"Подстраивать уровень соперника",adaptiveSub:"+50 за твою победу, −50 за поражение",
    tags:"Теги",tagModeAria:"Как совмещать теги",modeAll:"все сразу",modeAny:"любой из",find:"Найти соперника",

const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem("cfgd."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cfgd."+k,JSON.stringify(v))}catch(e){}}};
let settings=Object.assign({handle:"",rmin:1200,rmax:1600,bot:1500,limit:45,adaptive:true,tags:[],tagMode:"any",lang:/^ru/i.test(navigator.language||"")?"ru":"en"},LS.get("settings",{}));

let duel=LS.get("duel",null);
let problemsCache=null,solvedCache=null,polling=false,lastPollAt=0,lastPollTry=0,busy=false;

function tr(k,v={}){const x=(I18N[settings.lang]||I18N.ru)[k];return typeof x==="function"?x(v):x}
const tagName=x=>settings.lang==="ru"&&TAG_RU[x]||x;
const reasonText=r=>typeof r==="string"?r:tr("reason_"+r.k,r);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rand=n=>Math.floor(Math.random()*n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const key=p=>p.contestId+"-"+p.index;
function fmt(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;const mm=String(m).padStart(2,"0"),ss=String(x).padStart(2,"0");return h?h+":"+mm+":"+ss:mm+":"+ss}
function rc(r){if(r==null)return "";if(r<1200)return "r-gray";if(r<1400)return "r-green";if(r<1600)return "r-cyan";if(r<1900)return "r-blue";if(r<2100)return "r-violet";if(r<2400)return "r-orange";return "r-red"}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

let lastCall=0,chain=Promise.resolve();
async function request(method,params){
  const q=new URLSearchParams(params).toString();
  const url="https://codeforces.com/api/"+method+(q?"?"+q:"");
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),90000);
  let d;
  try{
    const r=await fetch(url,{credentials:"omit",cache:"no-store",signal:ctrl.signal});
    d=await r.json();
  }catch(e){
    console.warn("CF API: запрос не прошёл",url,e);
    throw new Error(e.name==="AbortError"?tr("errTimeout"):"NET");
  }finally{clearTimeout(timer)}
  if(d&&d.status==="OK")return d.result;
  console.warn("CF API:",url,d);
  throw new Error((d&&d.comment)||tr("errCf"));
}
function cf(method,params={}){
  const p=chain.then(async()=>{
    for(let attempt=0;;attempt++){
      const wait=lastCall+2100-Date.now();
      if(wait>0)await sleep(wait);
      lastCall=Date.now();
      try{return await request(method,params)}
      catch(e){
        const retry=(e.message==="NET"||/limit/i.test(e.message))&&attempt<2;
        if(!retry)throw e.message==="NET"?new Error(tr("errNet",{method})):e;
        await sleep(2500);
      }
    }
  });
  chain=p.catch(()=>{});
  return p;
}

async function loadProblems(){
  if(problemsCache)return problemsCache;
  const r=await cf("problemset.problems");
  problemsCache=r.problems.filter(p=>p.rating&&p.contestId<100000&&!p.tags.includes("*special"));
  return problemsCache;
}
async function loadSolved(handle){
  if(solvedCache&&solvedCache.handle===handle&&Date.now()-solvedCache.at<60000)return solvedCache;
  let subs;
  try{subs=await cf("user.status",{handle})}
  catch(e){throw new Error(tr("errHandle",{handle}))}
  const solved=new Set();let lastId=0;
  for(const s of subs){if(s.id>lastId)lastId=s.id;if(s.verdict==="OK")solved.add(key(s.problem))}
  solvedCache={handle,solved,lastId,at:Date.now()};
  return solvedCache;
}
function tagOk(p){
  const t=settings.tags;if(!t.length)return true;
  return settings.tagMode==="all"?t.every(x=>p.tags.includes(x)):t.some(x=>p.tags.includes(x));
}

function synthetic(p,R,limit,reason){
  const d=p.rating-R;
  const pSolve=1/(1+Math.pow(10,d/400));
  const solved=Math.random()<pSolve;
  const median=900*Math.pow(2,d/300);
  const t=Math.round(Math.max(90,median*Math.exp(0.45*gauss())));
  const span=solved?t:limit;
  const n=Math.min(4,Math.floor(-Math.log(Math.random())*(solved?0.7:1.2)));
  const rejects=Array.from({length:n},()=>Math.round(span*(0.3+0.65*Math.random()))).sort((a,b)=>a-b);
  return {type:"synthetic",rating:R,solveSec:solved?t:null,rejects,reason};
}
async function buildGhost(p,R,limit){
  let step="contest.ratingChanges";
  try{
    const changes=await cf(step,{contestId:p.contestId});
    if(!changes.length)return synthetic(p,R,limit,{k:"unrated"});
    const ratingOf=new Map(changes.filter(x=>x.oldRating>0).map(x=>[x.handle,x.oldRating]));
    if([...ratingOf.values()].filter(r=>Math.abs(r-R)<=350).length<3)return synthetic(p,R,limit,{k:"few"});
    step="contest.standings";
    // Таблицу обычного контеста CF отдаёт только целиком: с handles и другими параметрами запрос отклоняется
    const st=await cf(step,{contestId:p.contestId});
    const pi=st.problems.findIndex(q=>q.index===p.index);
    const hOf=r=>r.party.members[0].handle;
    const rows=st.rows.filter(r=>r.party.participantType==="CONTESTANT"&&ratingOf.has(hOf(r)));
    if(pi<0||!rows.length)return synthetic(p,R,limit,{k:"norows"});
    let pool=[];
    for(const d of [100,200,350]){pool=rows.filter(r=>Math.abs(ratingOf.get(hOf(r))-R)<=d);if(pool.length>=15)break}
    if(pool.length<3)return synthetic(p,R,limit,{k:"few"});
    const solvedOf=r=>{const q=r.problemResults[pi];return q.points>0&&q.bestSubmissionTimeSeconds!=null};
    const row=pool[rand(pool.length)];
    const handle=hOf(row);
    const pr=row.problemResults[pi];
    const ok=solvedOf(row);
    let solveSec=null,realAc=null,prev=0;
    if(ok){
      realAc=pr.bestSubmissionTimeSeconds;
      row.problemResults.forEach((q,j)=>{if(j!==pi&&q.points>0&&q.bestSubmissionTimeSeconds!=null&&q.bestSubmissionTimeSeconds<realAc)prev=Math.max(prev,q.bestSubmissionTimeSeconds)});
      solveSec=Math.max(60,realAc-prev);
    }
    const span=ok?solveSec:limit;
    const rejects=Array.from({length:Math.min(pr.rejectedAttemptCount||0,8)},()=>Math.round(span*(0.3+0.65*Math.random()))).sort((a,b)=>a-b);
    return {type:"ghost",handle,rating:ratingOf.get(handle),contestName:st.contest.name,contestId:p.contestId,rank:row.rank,solveSec,realAc,prevAc:ok?prev:null,rejects,field:pool.length,fieldSolved:pool.filter(solvedOf).length};
  }catch(e){
    if(/unavailable/i.test(e.message))return synthetic(p,R,limit,{k:"unrated"});
    console.warn("buildGhost",p.contestId+p.index,step,e);
    return synthetic(p,R,limit,{k:"apiErr",step,id:p.contestId,msg:e.message});
  }
}

function log(msg,err){const el=$("#log");el.className="log"+(err?" err":msg&&!err?" dots":"");el.textContent=msg||""}
function saveSettings(){LS.set("settings",settings)}

function readForm(){
  settings.handle=$("#handle").value.trim();
  settings.rmin=+$("#rmin").value||800;settings.rmax=+$("#rmax").value||3500;
  if(settings.rmin>settings.rmax)[settings.rmin,settings.rmax]=[settings.rmax,settings.rmin];
  settings.bot=+$("#bot").value||1500;
  settings.adaptive=$("#adaptive").checked;

}
function fillForm(){
  $("#handle").value=settings.handle;$("#rmin").value=settings.rmin;$("#rmax").value=settings.rmax;
  $("#bot").value=settings.bot;$("#adaptive").checked=settings.adaptive;
  $("#bot").className=rc(settings.bot);

function renderLimit(){
  document.querySelectorAll("[data-limit]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.limit===settings.limit));
}
function renderTags(){
  $("#tags").innerHTML=TAGS.map(t=>`<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${settings.tags.includes(t)}">${esc(tagName(t))}</button>`).join("");
  $("#mode-all").setAttribute("aria-pressed",settings.tagMode==="all");
  $("#mode-any").setAttribute("aria-pressed",settings.tagMode==="any");
}

async function search(){
  if(busy)return;
  readForm();
  if(!settings.handle){log(tr("needHandle"),true);$("#handle").focus();return}
  busy=true;$("#go").disabled=true;
  try{
    log(tr("loadingProblems"));
    const probs=await loadProblems();
    log(tr("loadingSolved"));
    const info=await loadSolved(settings.handle);
    const cand=probs.filter(p=>p.rating>=settings.rmin&&p.rating<=settings.rmax&&!info.solved.has(key(p))&&tagOk(p));
    if(!cand.length)throw new Error(tr("noProblems"));
    log(tr("searching"));
    // Если у контеста нет рейтинговых данных, пробуем ещё пару задач, прежде чем звать синтетического соперника
    let p,ghost;
    for(let i=0;i<3;i++){
      p=cand[rand(cand.length)];
      ghost=await buildGhost(p,settings.bot,settings.limit*60);
      if(ghost.type==="ghost")break;
    }
    duel={handle:settings.handle,problem:{contestId:p.contestId,index:p.index,name:p.name,rating:p.rating,tags:p.tags},
      limit:settings.limit*60,bot:settings.bot,ghost,lastId:info.lastId,subs:[],status:"ready",start:null};
    saveDuel();log("");render();
  }catch(e){log(e.message,true)}
  finally{busy=false;$("#go").disabled=false}
}
function startDuel(){duel.status="live";duel.start=Date.now();lastPollAt=0;lastPollTry=Date.now();saveDuel();render()}
function elapsed(){return duel&&duel.start?(Date.now()-duel.start)/1000:0}
function ghostAc(){const g=duel.ghost;return g.solveSec!=null&&g.solveSec<=duel.limit?g.solveSec:null}

async function poll(){
  if(!duel||duel.status!=="live"||polling)return;
  polling=true;lastPollTry=Date.now();
  const startedAt=Date.now();
  try{
    const subs=await cf("user.status",{handle:duel.handle,from:1,count:25});
    const t0=duel.start/1000;
    duel.subs=subs.filter(s=>s.id>duel.lastId&&s.problem.contestId===duel.problem.contestId&&s.problem.index===duel.problem.index)
      .map(s=>({id:s.id,t:Math.max(0,s.creationTimeSeconds-t0),v:s.verdict||"TESTING",test:s.passedTestCount}))
      .sort((a,b)=>a.t-b.t);
    lastPollAt=startedAt;duel.pollErr=null;saveDuel();
  }catch(e){duel.pollErr=e.message}
  polling=false;resolveDuel();renderArena();
}
function resolveDuel(){
  if(!duel||duel.status!=="live")return;
  const el=elapsed(),gAc=ghostAc();
  const ac=duel.subs.find(s=>s.v==="OK"&&s.t<=duel.limit);
  if(ac&&(gAc==null||ac.t<=gAc))return finish("won",ac.t);
  const cutoff=gAc!=null?gAc:duel.limit;
  if(el<cutoff){duel.waiting=false;return}
  const pending=duel.subs.some(s=>s.v==="TESTING"&&s.t<=cutoff);
  const fresh=lastPollAt>=duel.start+cutoff*1000+1500;
  if(pending||!fresh){duel.waiting=true;return}
  finish(gAc!=null?"lost":"draw",cutoff);
}
function finish(status,sec,gaveUp){
  duel.status=status;duel.endSec=sec;duel.gaveUp=!!gaveUp;duel.waiting=false;
  const g=duel.ghost;
  history.unshift({at:Date.now(),problem:duel.problem,status,sec,bot:duel.bot,
    opp:g.type==="ghost"?{handle:g.handle,rating:g.rating}:{handle:null,rating:g.rating},gaveUp:!!gaveUp});
  history=history.slice(0,50);LS.set("history",history);
  if(settings.adaptive){
    if(status==="won")settings.bot+=50;else if(status==="lost")settings.bot=Math.max(400,settings.bot-50);
    saveSettings();fillForm();
  }
  saveDuel();render();
}
function surrender(){if(duel&&duel.status==="live")finish("lost",elapsed(),true)}
function closeDuel(){duel=null;saveDuel();render()}

function verdictCell(s){
  if(s.v==="OK")return `<span class="v-ok">Accepted</span>`;
  if(s.v==="TESTING")return `<span class="v-wait">${tr("testing")}</span>`;
  const map={WRONG_ANSWER:"Wrong answer",TIME_LIMIT_EXCEEDED:"Time limit",MEMORY_LIMIT_EXCEEDED:"Memory limit",RUNTIME_ERROR:"Runtime error",COMPILATION_ERROR:"Compilation error",IDLENESS_LIMIT_EXCEEDED:"Idleness limit"};
  const name=map[s.v]||s.v.replace(/_/g," ").toLowerCase();
  const test=s.v!=="COMPILATION_ERROR"&&s.test!=null?` on test ${s.test+1}`:"";
  return `<span class="v-bad">${esc(name+test)}</span>`;
}
function oppLabel(g){return `<span class="${rc(g.rating)}">${g.rating!=null?g.rating:"?"}</span>`}

function renderArena(){
  const a=$("#arena");
  if(!duel){a.hidden=true;return}
  a.hidden=false;
  const p=duel.problem,g=duel.ghost,url=`https://codeforces.com/problemset/problem/${p.contestId}/${p.index}`;
  if(duel.status==="ready"){
    a.innerHTML=`<h2>${tr("found")}</h2>
      <div class="vs">
        <div class="side"><small>${tr("you")}</small><span class="handle">${esc(duel.handle)}</span></div>
        <span class="x">vs</span>
        <div class="side"><small>${tr(g.type==="ghost"?"ghost":"synthetic")}</small><span class="rt">${oppLabel(g)}</span></div>
      </div>
      ${g.type!=="ghost"?`<p class="hint">${tr("whyNot")} ${esc(reasonText(g.reason))}</p>`:""}
      <p class="hint">${tr("readyHint",{rating:p.rating,limit:fmt(duel.limit)})}</p>
      <div class="actions"><button class="btn primary" data-act="start">${tr("start")}</button><button class="btn" data-act="close">${tr("another")}</button></div>`;
    return;
  }
  const el=duel.status==="live"?elapsed():duel.endSec;
  const gAc=ghostAc();
  const shownRejects=g.rejects.filter(x=>x<=el&&(gAc==null||x<gAc));
  const gEvents=shownRejects.map(x=>`<li><span class="ts">${fmt(x)}</span><span class="v-bad">${tr("rejected")}</span></li>`).join("")
    +(gAc!=null&&el>=gAc?`<li><span class="ts">${fmt(gAc)}</span><span class="v-ok">Accepted</span></li>`:"");
  const uEvents=duel.subs.filter(s=>s.t<=el+120).map(s=>`<li><span class="ts">${fmt(s.t)}</span>${verdictCell(s)}</li>`).join("");
  const gState=tr(duel.status==="live"?(gAc!=null&&el>=gAc?"gSubmitted":"gSolving"):(gAc!=null&&gAc<=duel.endSec?"solved":"notSolved"));
  const uState=duel.status==="live"?(duel.pollErr?`<span class="v-bad">${esc(duel.pollErr)}</span>`:tr("polling")):tr(duel.status==="won"?"solved":"notSolved");
  const tagsHtml=duel.status==="live"?`<span class="tag">${tr("tagsHidden")}</span>`:p.tags.map(x=>`<span class="tag">${esc(tagName(x))}</span>`).join("");
  let result="";
  if(duel.status!=="live"){
    const title=tr({won:"titleWon",lost:duel.gaveUp?"titleGaveUp":"titleLost",draw:"titleDraw"}[duel.status]);
    const reveal=g.type==="ghost"
      ?tr("revealGhost",{...g,contestName:esc(g.contestName),link:`<a href="https://codeforces.com/profile/${encodeURIComponent(g.handle)}" target="_blank" rel="noopener" class="${rc(g.rating)}">${esc(g.handle)}</a>`})
      :tr("revealSynth",{rating:g.rating,reason:esc(reasonText(g.reason))});
    result=`<div class="result ${duel.status}"><h3>${title}</h3><p>${reveal}</p>
      <div class="actions"><button class="btn primary" data-act="next">${tr("nextDuel")}</button><button class="btn" data-act="close">${tr("toSettings")}</button></div></div>`;
  }
  a.innerHTML=`
    <div class="problem">
      <div><div class="pid">${p.contestId}${esc(p.index)} · <span class="${rc(p.rating)}">${p.rating}</span></div><h3>${esc(p.name)}</h3><div class="meta">${tagsHtml}</div></div>
      <a class="btn" href="${url}" target="_blank" rel="noopener">${tr("openProblem")}</a>
    </div>
    <div class="clock"><span class="t" id="clockT">${fmt(el)}</span><span class="sub" id="clockS">${clockSub()}</span><div class="bar"><i id="clockBar" style="width:${Math.min(100,el/duel.limit*100)}%"></i></div></div>
    <div class="lanes">
      <div class="lane you"><div class="who"><b>${tr("laneYou")}</b><span class="handle">${esc(duel.handle)}</span></div><span class="state">${uState}</span><ul class="feed">${uEvents||`<li><span class="ts">—</span><span class="state">${tr("noSubs")}</span></li>`}</ul></div>
      <div class="lane gh"><div class="who"><b>${tr("laneOpp")}</b><span class="rt" style="font-size:16px">${oppLabel(g)}</span></div><span class="state">${gState}</span><ul class="feed">${gEvents||`<li><span class="ts">—</span><span class="state">${tr("writing")}</span></li>`}</ul></div>
    </div>
    ${duel.status==="live"?`<div class="actions"><button class="btn" data-act="poll">${tr("checkNow")}</button><button class="btn danger" data-act="surrender">${tr("surrender")}</button></div>`:result}`;
}
function clockSub(){return duel.waiting?tr("waiting"):tr("of",{limit:fmt(duel.limit)})}
function renderClock(){
  if(!duel||duel.status!=="live")return;
  const el=elapsed(),clock=$("#clockT");if(!clock)return;
  clock.textContent=fmt(Math.min(el,duel.limit));
  $("#clockBar").style.width=Math.min(100,el/duel.limit*100)+"%";
  $("#clockS").textContent=clockSub();
}
function renderHistory(){
  const w=history.filter(h=>h.status==="won").length,l=history.filter(h=>h.status==="lost").length,d=history.filter(h=>h.status==="draw").length;
  $("#record").innerHTML=history.length?`<i class="w">${w} W</i><i class="l">${l} L</i><i>${d} D</i>`:"";
  if(!history.length){$("#histBody").innerHTML=`<p class="empty">${tr("histEmpty")}</p>`;return}
  const lab={won:tr("bWon"),lost:tr("bLost"),draw:tr("bDraw")};
  $("#histBody").innerHTML=`<div class="tbl"><table><thead><tr><th class="c-date">${tr("hDate")}</th><th>${tr("hProblem")}</th><th>${tr("hResult")}</th><th>${tr("hTime")}</th><th>${tr("hOpp")}</th></tr></thead><tbody>${
    history.slice(0,20).map(h=>`<tr><td class="c-date">${new Date(h.at).toLocaleDateString(settings.lang==="ru"?"ru-RU":"en-GB",{day:"2-digit",month:"2-digit"})}</td>
      <td class="p"><a href="https://codeforces.com/problemset/problem/${h.problem.contestId}/${encodeURIComponent(h.problem.index)}" target="_blank" rel="noopener">${h.problem.contestId}${esc(h.problem.index)}</a> ${esc(h.problem.name)} <span class="state">${h.problem.rating}</span></td>
      <td><span class="badge ${h.status}">${lab[h.status]}</span>${h.gaveUp?` <span class="state">${tr("gaveUpShort")}</span>`:""}</td><td>${fmt(h.sec)}</td>
      <td>${h.opp.handle?`<span class="${rc(h.opp.rating)}">${esc(h.opp.handle)}</span>`:`<span class="${rc(h.opp.rating)}">${tr("bot",{rating:h.opp.rating})}</span>`}</td></tr>`).join("")
  }</tbody></table></div>`;
}
function applyLang(){
  document.documentElement.lang=settings.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=tr(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label",tr(el.dataset.i18nAria)));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===settings.lang));
}
function render(){
  $("#setup").hidden=!!duel;
  renderArena();renderHistory();
}

document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip");
  if(chip){const t=chip.dataset.tag;settings.tags=settings.tags.includes(t)?settings.tags.filter(x=>x!==t):[...settings.tags,t];saveSettings();renderTags();return}
  if(e.target.id==="mode-all"||e.target.id==="mode-any"){settings.tagMode=e.target.id==="mode-all"?"all":"any";saveSettings();renderTags();return}
  const lb=e.target.closest("[data-lang]");
  if(lb){settings.lang=lb.dataset.lang;saveSettings();applyLang();renderTags();log("");render();return}
  const lim=e.target.closest("[data-limit]");
  if(lim){settings.limit=+lim.dataset.limit;saveSettings();renderLimit();return}
  const step=e.target.closest("[data-step]");
  if(step){const i=step.parentElement.querySelector("input");i.value=Math.min(+i.max,Math.max(+i.min,(+i.value||0)+ +step.dataset.step));i.dispatchEvent(new Event("input"));return}
  const act=e.target.closest("[data-act]");if(!act)return;
  const a=act.dataset.act;
  if(a==="start")startDuel();
  else if(a==="close")closeDuel();
  else if(a==="next"){closeDuel();search()}
  else if(a==="poll")poll();
  else if(a==="surrender")surrender();
});
$("#go").addEventListener("click",search);
$("#bot").addEventListener("input",e=>{e.target.className=rc(+e.target.value)});
$("#handle").addEventListener("keydown",e=>{if(e.key==="Enter")search()});

setInterval(()=>{
  if(!duel||duel.status!=="live")return;
  const before=duel.waiting;
  resolveDuel();
  if(!duel||duel.status!=="live")return;
  const gAc=ghostAc(),el=elapsed();
  const ghostJustActed=duel.ghost.rejects.some(t=>t<=el&&t>el-0.6)||(gAc!=null&&gAc<=el&&gAc>el-0.6);
  if(ghostJustActed||before!==duel.waiting)renderArena();else renderClock();
  const gap=duel.waiting?3000:6000;
  if(!polling&&Date.now()-lastPollTry>gap)poll();
},500);

applyLang();fillForm();render();
</script>
</body>
</html>
